<div class="rangahaua-embed">
  <iframe
    id="rangahaua-page"
    src="https://twh-nz.github.io/uk-trip-webpage/sections/01-hero/"
    title="Rangahaua"
    scrolling="no"
    loading="eager">
  </iframe>
</div>

<style>
.rangahaua-embed{width:100%;overflow:hidden}
.rangahaua-embed iframe{
  display:block;
  width:100%;
  height:8500px; /* fallback until GitHub page reports exact height */
  border:0;
  overflow:hidden;
}
@media(max-width:767px){
  .rangahaua-embed iframe{height:12000px}
}
</style>

<script>
(function(){
  const iframe=document.getElementById('rangahaua-page');
  let lastAppliedHeight=0;
  window.addEventListener('message',function(event){
    if(!event.data || event.data.type!=='rangahaua-height') return;
    const reportedHeight=Number(event.data.height);
    if(!iframe || !Number.isFinite(reportedHeight) || reportedHeight<=0) return;
    const finalHeight=Math.ceil(reportedHeight+16);
    if(Math.abs(finalHeight-lastAppliedHeight)>3){
      lastAppliedHeight=finalHeight;
      iframe.style.height=finalHeight+'px';
    }
  });
})();
</script>
